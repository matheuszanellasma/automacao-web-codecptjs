name: Testes Smoke

on:
  push:
    branches:
      - master

jobs:
  codeceptjs-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run CodeceptJS smoke tests
        env:
          HEADLESS: 'true'
        run: npx codeceptjs run --grep "@smoke" --reporter mochawesome

      - name: Upload CodeceptJS Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: codeceptjs-report
          path: output/
